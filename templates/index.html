<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SIAT-TNR</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <h1>Sistema Inteligente de Alerta Temprana de TNR</h1>
        <p class="subtitle">
            Estimación de probabilidad de TNR alta por conglomerado
        </p>

        <div class="form-card">
            <div class="grid">

                <div>
                    <label>Año</label>
                    <input type="number" id="anio" value="2026">
                </div>

                <div>
                    <label>Mes</label>
                    <select id="mes">
                        <option value="ene">Enero</option>
                        <option value="feb">Febrero</option>
                        <option value="mar">Marzo</option>
                        <option value="abr">Abril</option>
                        <option value="may">Mayo</option>
                        <option value="jun">Junio</option>
                        <option value="jul">Julio</option>
                        <option value="ago">Agosto</option>
                        <option value="sep">Septiembre</option>
                        <option value="oct">Octubre</option>
                        <option value="nov">Noviembre</option>
                        <option value="dic">Diciembre</option>
                    </select>
                </div>

                <div>
                    <label>Departamento</label>
                    <input type="text" id="departamento" placeholder="Ej. Lima Metropolitana">
                </div>

                <div>
                    <label>Estrato</label>
                    <input type="text" id="estratos" placeholder="Ej. Medio">
                </div>

                <div>
                    <label>Dominio geográfico</label>
                    <input type="text" id="geografico" placeholder="Ej. Lima Metropolitana">
                </div>

                <div>
                    <label>Promedio de visitas</label>
                    <input type="number" step="0.01" id="visitas" value="1">
                </div>

                <div>
                    <label>TNR histórica conglomerado</label>
                    <input type="number" step="0.01" id="tnr_cong" value="0">
                </div>

                <div>
                    <label>TNR histórica distrito</label>
                    <input type="number" step="0.01" id="tnr_dist" value="0">
                </div>

                <div>
                    <label>TNR histórica departamento</label>
                    <input type="number" step="0.01" id="tnr_dep" value="0">
                </div>

                <div>
                    <label>TEM</label>
                    <input type="number" step="0.01" id="tem" value="0">
                </div>

                <div>
                    <label>Número de hogares</label>
                    <input type="number" step="0.01" id="n_hogar" value="1">
                </div>

            </div>

            <button onclick="calcularRiesgo()">Calcular riesgo</button>
        </div>

        <div id="resultado" class="resultado oculto">
            <h2>Resultado</h2>
            <p id="probabilidad"></p>
            <p id="riesgo"></p>
            <p id="clasificacion"></p>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
